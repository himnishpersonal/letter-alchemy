[project]
name = "letter-alchemy-backend"
version = "0.1.0"
description = "Daily word transformation puzzles"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
pipeline = ["wordfreq==3.1.1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
alchemy-generate = "alchemy.generate:main"
alchemy-audit = "alchemy.audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alchemy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
